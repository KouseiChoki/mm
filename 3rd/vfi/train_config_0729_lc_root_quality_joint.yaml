# Root-quality stage: improve the whole 0729 model instead of calibrating a
# frozen add-on.  Start from 0729_lc_v3s2_800.pkl without --resume.
#
# Main changes relative to 0729:
#   1. all backbone/flow/local/mask/refiner parameters remain trainable;
#   2. ordinary no-MV samples actively crop small interpolation-hard regions;
#   3. motion-weighted edge loss supervises both final output and last warp,
#      so the refiner cannot hide inaccurate small-object flow;
#   4. no teacher-flow, CAUN, sparse-matcher, PerVFI or multi-hypothesis branch.
#
# Launch:
#   conda run -n vfi python train.py \
#     --config train_config_0729_lc_root_quality_joint.yaml \
#     --restore_ckpt ckpt/0729_lc_v3s2/0729_lc_v3s2_800.pkl

exp_name: 0818_0729_lc_root_quality_joint
seed: 1234

model:
  F: 32
  depth: [2, 2, 2, 3, 3]
  version: 3
  refine_attn_dim: 512
  refine_attn_heads: 8
  refine_kv_pool: 4
  refine_res_scale: 0.25
  ssm_version: 2
  ssd_dstate: 64
  ssd_headdim: 64
  ssd_chunk: 256

  blend_mode: soft
  pervfi_mask_loss_weight: 0.0
  loss_type: lc
  lc_charbonnier_eps: 1.0e-3
  lc_census_weight: 1.0
  lc_lap_weight: 1.0
  lc_warp_weight: 0.5
  merge_loss_gamma: 0.5
  normalize_pixel_loss: true
  residual_loss_weight: 0.01

  # Luminance gradient supervision is intentionally light.  The last-warp
  # term sends the boundary error into flow/mask, while the final term keeps
  # the refiner from smoothing the corrected boundary again.
  edge_loss_weight: 0.15
  edge_warp_loss_weight: 0.10
  edge_motion_gain: 2.0
  edge_motion_scale: 0.10
  edge_weight_cap: 3.0
  edge_charbonnier_eps: 1.0e-3

  flow_loss_weight: 0.0
  flow_loss_warmup_steps: 0
  flow_stage_gamma: 0.2
  flow_motion_threshold: 1.0
  flow_motion_balance: 0.1
  flow_motion_gain: 0.0
  flow_motion_scale: 10.0
  flow_motion_weight_cap: 4.0
  flow_charbonnier_eps: 1.0e-3

  flow_num_stages: 3
  compact_quarter_head: false
  zero_init_residual_heads: true
  local_zero_init: true
  content_aware_upsampling: false
  sparse_matching: false
  multi_hypothesis: false

optim:
  lr_max: 2.0e-5
  lr_min: 2.0e-6
  warmup_steps: 500
  finetune: false
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  backbone_lr_scale: 1.0
  flow_lr_scale: 1.0
  refine_lr_scale: 1.0

data:
  root: /home/zhenying/qhong/data/ssd/vfi_database
  lists_dir: /home/zhenying/qhong/data/ssd/vfi_database/lists
  tiers: [easy, normal, hard, opensource]
  batch_size: 6
  num_workers: 24
  prefetch_factor: 4
  in_order: false
  val_num_workers: 4
  val_samples_per_scene: 1
  crop_sizes: [[384, 704, 6]]
  framesteps: [1, 2]
  t_half_prob: 1.0
  mv_prob: 0.0
  mv_sign: [1, 1]
  mv_symmetry_confidence: false
  occ_alpha: 0.05
  occ_beta: 1.0

  # This is the important sampling fix: unlike motion_aware_crop, it works on
  # ordinary data without MV by using the three-frame interpolation residual.
  motion_aware_crop_prob: 0.0
  interpolation_aware_crop_prob: 0.6
  interpolation_residual_threshold: 0.04
  motion_crop_threshold: 1.0
  small_motion_min_pixels: 12
  small_motion_max_ratio: 0.08
  motion_crop_jitter: 0.2
  augment_profile: legacy
  val_lists:
    all: val.txt
    easy: easy_val.txt
    normal: normal_val.txt
    hard: hard_val.txt
    opensource: opensource_val.txt

phases:
  - name: root_joint_balanced
    epochs: 80
    steps_per_epoch: 802
    grad_accum_steps: 2
    lr_schedule: phase
    trainable: all
    local: true
    crop_sizes: [[384, 704, 6]]
    ratios: {easy: 0.166667, normal: 0.166667, hard: 0.166667, opensource: 0.5}
    batch_counts: {easy: 1, normal: 1, hard: 1, opensource: 3}

  - name: root_joint_hard_focus
    epochs: 40
    steps_per_epoch: 802
    grad_accum_steps: 2
    lr_schedule: phase
    trainable: all
    local: true
    crop_sizes: [[384, 704, 6]]
    ratios: {easy: 0.166667, normal: 0.166667, hard: 0.5, opensource: 0.166667}
    batch_counts: {easy: 1, normal: 1, hard: 3, opensource: 1}
    optim:
      lr_max: 8.0e-6
      lr_min: 2.0e-6
      warmup_steps: 200

monitor:
  record_root: record
  eval_every_epochs: 10
  save_every_epochs: 5
  log_every_steps: 100
  print_every_steps: 10
  spike_ratio: 3.0
  spike_dir: spike_samples
  flow_loss_dump_threshold: 40
  dump_dir: anomaly_dumps
  dump_max: 20
  best_metric: all/psnr
  best_mode: max
