# Resume the 0812_lc_v1s1 run from epoch 110 with regenerated lists, then
# freeze the converged main network and fine-tune only the local IFBlock.
#
# Launch from this directory with:
#   python train.py --config 0813_hx_resume.yaml \
#     --restore_ckpt ckpt/0812_lc_v1s1/0812_lc_v1s1_110.pkl --resume

exp_name: 0812_lc_v1s1
seed: 1234

model:
  F: 32
  depth: [2, 2, 2, 3, 3]
  version: 1
  refine_attn_dim: 512
  refine_attn_heads: 8
  refine_kv_pool: 4
  refine_res_scale: 0.25
  ssm_version: 1
  ssd_dstate: 64
  ssd_headdim: 64
  ssd_chunk: 256
  loss_type: lc
  M: false
  lc_charbonnier_eps: 1.0e-3
  lc_census_weight: 1.0
  lc_lap_weight: 1.0
  lc_warp_weight: 0.5
  flow_loss_weight: 0
  flow_loss_warmup_steps: 10000
  flow_stage_gamma: 0.2
  flow_motion_threshold: 1.0
  flow_motion_balance: 0.1
  flow_motion_gain: 0.0
  flow_motion_scale: 10.0
  flow_motion_weight_cap: 4.0
  flow_charbonnier_eps: 1.0e-3
  flow_num_stages: 2
  compact_quarter_head: false
  zero_init_residual_heads: true
  local_zero_init: true
  merge_loss_gamma: 0.5
  normalize_pixel_loss: true
  residual_loss_weight: 0.01

optim:
  lr_max: 2.5e-5
  lr_min: 2.5e-6
  warmup_steps: 5000
  finetune: false
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  backbone_lr_scale: 1.0
  flow_lr_scale: 1.0
  refine_lr_scale: 1.0

data:
  root: /home/zhenying/qhong/data/ssd/vfi_database
  lists_dir: /home/zhenying/qhong/data/ssd/vfi_database/lists
  tiers: [easy, normal, hard, opensource, illumination, noise, teacher]
  val_samples_per_scene: 1
  batch_size: 1
  num_workers: 8
  val_num_workers: 4
  crop_sizes:
    - [384, 704, 6]
  framesteps: [1, 2]
  t_half_prob: 1
  mv_prob: 1
  mv_sign: [1, 1]
  mv_symmetry_confidence: false
  occ_alpha: 0.05
  occ_beta: 1.0
  motion_aware_crop_prob: 0.5
  motion_crop_threshold: 1.0
  small_motion_min_pixels: 8
  small_motion_max_ratio: 0.05
  motion_crop_jitter: 0.2
  val_lists:
    all: val.txt
    easy: easy_val.txt
    normal: normal_val.txt
    hard: hard_val.txt
    opensource: opensource_val.txt
    illumination: illumination_val.txt
    noise: noise_val.txt
    teacher: teacher_val.txt

phases:
  # Epoch 110 checkpoint already trained with local enabled. Keep it enabled
  # here to avoid changing the forward path in the middle of a true resume.
  - name: allmix
    epochs: 800
    trainable: all
    local: true
    ratios: {easy: 0.2, normal: 0.2, hard: 0.2, opensource: 0.4}

  # After the joint stage converges, freeze every parameter except
  # local_block.* and calibrate IFBlock with a fresh low-LR phase schedule.
  - name: ifblock_finetune
    epochs: 80
    steps_per_epoch: 2000
    grad_accum_steps: 1
    lr_schedule: phase
    trainable: local_ifblock
    local: true
    crop_sizes:
      - [384, 704, 6]
    ratios: {easy: 0.2, normal: 0.2, hard: 0.2, opensource: 0.4}
    optim:
      lr_max: 1.0e-5
      lr_min: 1.0e-6
      warmup_steps: 500

monitor:
  eval_every_epochs: 20
  save_every_epochs: 10
  log_every_steps: 100
  spike_ratio: 3.0
  spike_dir: spike_samples
  flow_loss_dump_threshold: 40
  dump_max: 1000
  best_metric: all/psnr
  best_mode: auto
