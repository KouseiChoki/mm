# VFIMamba 训练配置 (train.py 唯一超参来源)
# 用法: python train.py --config train_config.yaml [--restore_ckpt xxx.pkl]

exp_name: Kousei_phase1_0721_easymix          # 实验名: log目录/ckpt目录/TensorBoard 均用它

seed: 1234

# ── 模型 (传给 config.init_model_config) ────────────────────────────────────
model:
  F: 48
  depth: [2, 2, 2, 3, 3]
  version: 2                       # unet选择 (语义不变)
  ssm_version: 2                   # 新: 1=S6(v1/v2现状), 2=Mamba2 SSD
  ssd_dstate: 64                   # SSD状态维 (S6用16; SSD成本结构不同, 64起步)
  ssd_headdim: 64                  # d_inner须被整除: F48→stage3/4 d_inner=768/1536 ✓
  ssd_chunk: 256
  loss_type: l1
  flow_loss_weight: 0.01
  flow_stage_gamma: 0.8            # 所有flow阶段深监督, 后级权重递增
  flow_motion_threshold: 1.0       # 像素; 相对全局中位flow的前景运动阈值
  flow_motion_balance: 0.5         # 移动区在每个样本flow loss中的固定占比
  flow_motion_gain: 1.0            # 移动区内大位移软加权
  flow_motion_scale: 10.0
  flow_motion_weight_cap: 4.0
  flow_charbonnier_eps: 1.0e-3
  flow_num_stages: 3               # 1/16 → 1/8 → 1/4 learned-feature heads
  compact_quarter_head: true       # 1/4网格预测后上采样, 避免全分辨率重卷积
  zero_init_residual_heads: true   # 新增残差head从identity开始
  local_zero_init: true            # 续训时新local级不破坏原输出
  local_cfg: [[2, 4, 1.0, 8], [1, 2, 1.0, 8], [1, 1, 0.5, 4]]

# 从头训练参数；保留main当前实验的学习率与warmup设置
optim:
  lr_max: 2.5e-5
  lr_min: 2.5e-6
  warmup_steps: 5000
  finetune: false
  # 5090 推荐 BF16；只有改为 fp16 时才会启用 GradScaler。
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
# data / phases / monitor 段沿用现有生产yaml

# ── 数据 ─────────────────────────────────────────────────────────────────────
data:
  root: /home/zhenying/qhong/data/ssd/vfi_database
  lists_dir: /home/zhenying/qhong/data/ssd/vfi_database/lists
  # 新分类的目录名/list前缀; ratio=0时允许对应list暂不存在。
  tiers: [easy, normal, hard, opensource, illumination, noise, teacher]
  batch_size: 1
  num_workers: 8
  crop_sizes:                  # 多尺度: 每个epoch随机选一组 (h, w), 需为16倍数
    - [288, 512,  4]
    - [384, 704,  3]
    - [480, 880,  2]
    - [672, 1200, 1]
  framesteps: [1, 2]
  t_half_prob: 1             # t=0.5 采样概率, 其余均匀采窗口内任意t
  mv_prob: 1                 # teacher scene 采为flow监督样本(s=1,t=0.5)的概率
  mv_sign: [1, 1]              # !! 必须先用 verify_mv_convention.py 实证后填 !!
  motion_aware_crop_prob: 0.5  # teacher样本中, 一半裁剪对准小运动物体
  motion_crop_threshold: 1.0   # 相对全局中位flow的残差阈值(像素)
  small_motion_min_pixels: 8
  small_motion_max_ratio: 0.05 # 小运动连通域最大占crop面积
  motion_crop_jitter: 0.2      # 目标中心偏移, 避免总在crop正中

# ── 训练阶段 (顺序执行, 配比可切换) ──────────────────────────────────────────
phases:
  #- name: base                 # Phase 1: easy+normal 为主
    #epochs: 200
    #ratios: {easy: 0.20, normal: 0.10, hard: 0.05, teacher: 0.65}
  - name: easy_mix             # Phase 2: hard为主的混合 (防遗忘保留easy/normal)
    epochs: 200
    ratios: {easy: 0.30, normal: 0.15, hard: 0.15, teacher: 0.40, opensource: 0.0, illumination: 0.0, noise: 0.0}
  - name: normal_mix             # Phase 2: hard为主的混合 (防遗忘保留easy/normal)
    epochs: 200
    ratios: {easy: 0.20, normal: 0.30, hard: 0.30, teacher: 0.20, opensource: 0.0, illumination: 0.0, noise: 0.0}
  - name: hard_mix             # Phase 2: hard为主的混合 (防遗忘保留easy/normal)
    epochs: 400
    ratios: {easy: 0.20, normal: 0.30, hard: 0.40, teacher: 0.10, opensource: 0.0, illumination: 0.0, noise: 0.0}

# ── 监控 / 保存 ──────────────────────────────────────────────────────────────
monitor:
  eval_every_epochs: 10
  save_every_epochs: 10
  log_every_steps: 100
  spike_ratio: 3.0
  spike_dir: spike_samples
  flow_loss_dump_threshold: 40
  dump_max: 1000
