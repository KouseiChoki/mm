# S2V3 all-data + teacher，512x512大crop像素预算版。
# 256->512后单样本像素数为4倍，因此：
#   micro batch 20->10，grad accumulation 2->4，global batch仍为40；
#   steps/epoch 1604->401，使每轮总训练像素量基本保持不变；
#   optimizer/flow warmup steps同步缩短到原来的1/4。
# 启动：
#   conda run -n vfi python train.py \
#     --config train_config_s2v3_all_teacher_fixed_crop512.yaml

exp_name: 0811_s2v3_all_teacher_flow_fixed_crop512
seed: 1234

model:
  F: 32
  depth: [2, 2, 2, 3, 3]
  version: 3
  refine_attn_dim: 512
  refine_attn_heads: 8
  refine_kv_pool: 4
  refine_res_scale: 0.05

  ssm_version: 2
  ssd_dstate: 64
  ssd_headdim: 64
  ssd_chunk: 256

  blend_mode: soft
  pervfi_mask_loss_weight: 0.0
  loss_type: lap
  merge_loss_weights: [0.5]
  normalize_pixel_loss: false
  residual_loss_weight: 0.0

  flow_loss_weight: 0.002
  flow_loss_warmup_steps: 2500
  flow_stage_gamma: 0.2
  flow_motion_threshold: 1.0
  flow_motion_balance: 0.8
  flow_motion_gain: 1.0
  flow_motion_scale: 10.0
  flow_motion_weight_cap: 4.0
  flow_charbonnier_eps: 1.0e-3

  flow_num_stages: 3
  compact_quarter_head: false
  zero_init_residual_heads: true
  local_zero_init: false

optim:
  lr_max: 2.0e-4
  lr_min: 2.0e-5
  warmup_steps: 500
  finetune: false
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  backbone_lr_scale: 1.0
  flow_lr_scale: 1.0
  refine_lr_scale: 1.0

data:
  root: /home/zhenying/qhong/data/ssd/vfi_database
  lists_dir: /home/zhenying/qhong/data/ssd/vfi_database/lists
  tiers: [easy, normal, hard, vimeo, xtrain, teacher]
  batch_size: 10
  num_workers: 24
  prefetch_factor: 4
  in_order: false
  val_num_workers: 4
  val_samples_per_scene: 1
  crop_sizes:
    - [512, 512, 10]
  framesteps: [1, 2]
  t_half_prob: 1.0
  mv_prob: 1.0
  mv_sign: [1, 1]
  mv_symmetry_confidence: false
  occ_alpha: 0.05
  occ_beta: 1.0

  mv_cache_dirname: mv_cache_f16
  mv_cache_required: true
  mv_cache_preview_stride: 4
  motion_aware_crop_prob: 0.5
  motion_crop_threshold: 1.0
  small_motion_min_pixels: 8
  small_motion_max_ratio: 0.05
  motion_crop_jitter: 0.2
  augment_profile: legacy
  source_options:
    vimeo:
      framesteps: [1]
      # Vimeo原图仅256x448；先等比例放大，避免512 crop产生大面积反射padding。
      resize_hw: [512, 896]
      augment_profile: vimeo
    xtrain:
      framesteps: [1]
      resize_hw: [512, 512]
      augment_profile: vimeo
    teacher:
      framesteps: [1]
      augment_profile: legacy
  val_lists:
    all: val.txt
    easy: easy_val.txt
    normal: normal_val.txt
    hard: hard_val.txt
    vimeo: vimeo_val.txt
    xtrain: xtrain_val.txt
    teacher: teacher_val.txt

phases:
  - name: all_teacher_fixed_crop512
    epochs: 240
    steps_per_epoch: 401
    grad_accum_steps: 4
    lr_schedule: phase
    trainable: all
    local: false
    crop_sizes:
      - [512, 512, 10]
    # micro batch10；累积4次后global batch40，来源比例与256版一致。
    ratios: {vimeo: 0.5, xtrain: 0.1, easy: 0.1, normal: 0.1, hard: 0.1, teacher: 0.1}
    batch_counts: {vimeo: 5, xtrain: 1, easy: 1, normal: 1, hard: 1, teacher: 1}
    curriculum:
      source: xtrain
      every_epochs: 40
      max_stage: 5
      framestep_start: 1
      framestep_multiplier: 2
      resize_start: 512
      resize_multiplier: 1.1

  - name: teacher_ifblock_fixed_crop512
    epochs: 80
    steps_per_epoch: 401
    grad_accum_steps: 4
    lr_schedule: phase
    trainable: local_ifblock
    local: true
    crop_sizes:
      - [512, 512, 10]
    ratios: {vimeo: 0.9, teacher: 0.1, xtrain: 0.0, easy: 0.0, normal: 0.0, hard: 0.0}
    batch_counts: {vimeo: 9, teacher: 1}

monitor:
  eval_every_epochs: 20
  save_every_epochs: 10
  log_every_steps: 100
  print_every_steps: 10
  spike_ratio: 3.0
  spike_dir: spike_samples_s2v3_all_teacher_flow_fixed_crop512
  flow_loss_dump_threshold: 40
  dump_dir: anomaly_dumps_s2v3_all_teacher_flow_fixed_crop512
  dump_max: 20
  best_metric: teacher/moving_flow_epe
  best_mode: min
