# S2V3 all-data + teacher修正版。
# 修正依据：MV符号/顺序/单位已实测正确；旧实验的问题是teacher监督过强、
# 静止区域占比过高，而不是flow convention错误。
#
# 先生成一次快速MV缓存（约占原分辨率4通道float16的空间）：
#   conda run -n vfi python data_prepare/build_mv_cache.py \
#     --root /home/zhenying/qhong/data/ssd/vfi_database --workers 8 --verify
# 从头训练：
#   conda run -n vfi python train.py --config train_config_s2v3_all_teacher_fixed.yaml
# 当前32核机器建议用下面三个运行时覆盖项；它们不改变归档yaml，可安全resume：
#   --loader_workers 24 --loader_prefetch 4 --loader_out_of_order

exp_name: 0810_s2v3_all_teacher_flow_fixed
seed: 1234

model:
  F: 32
  depth: [2, 2, 2, 3, 3]
  version: 3
  refine_attn_dim: 512
  refine_attn_heads: 8
  refine_kv_pool: 4
  refine_res_scale: 0.05

  ssm_version: 2
  ssd_dstate: 64
  ssd_headdim: 64
  ssd_chunk: 256

  blend_mode: soft
  pervfi_mask_loss_weight: 0.0
  loss_type: lap
  merge_loss_weights: [0.5]
  normalize_pixel_loss: false
  residual_loss_weight: 0.0

  # teacher仅占micro batch的10%。flow loss从0.01降至0.002，避免压过图像loss。
  # balance=0.8表示moving/static=80%/20%；旧值0.1实际是10%/90%。
  flow_loss_weight: 0.002
  flow_loss_warmup_steps: 10000
  flow_stage_gamma: 0.2
  flow_motion_threshold: 1.0
  flow_motion_balance: 0.8
  flow_motion_gain: 1.0
  flow_motion_scale: 10.0
  flow_motion_weight_cap: 4.0
  flow_charbonnier_eps: 1.0e-3

  flow_num_stages: 3
  compact_quarter_head: false
  zero_init_residual_heads: true
  local_zero_init: false

optim:
  lr_max: 2.0e-4
  lr_min: 2.0e-5
  warmup_steps: 2000
  finetune: false
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  backbone_lr_scale: 1.0
  flow_lr_scale: 1.0
  refine_lr_scale: 1.0

data:
  root: /home/zhenying/qhong/data/ssd/vfi_database
  lists_dir: /home/zhenying/qhong/data/ssd/vfi_database/lists
  tiers: [easy, normal, hard, vimeo, xtrain, teacher]
  batch_size: 20
  num_workers: 12
  val_num_workers: 4
  val_samples_per_scene: 1
  crop_sizes:
    - [256, 256, 20]
  framesteps: [1, 2]
  t_half_prob: 1.0
  mv_prob: 1.0
  mv_sign: [1, 1]
  mv_symmetry_confidence: false
  occ_alpha: 0.05
  occ_beta: 1.0

  # teacher MV优先mmap读取未压缩float16缓存；required防止静默退回慢EXR。
  mv_cache_dirname: mv_cache_f16
  mv_cache_required: true
  mv_cache_preview_stride: 4
  motion_aware_crop_prob: 0.5
  motion_crop_threshold: 1.0
  small_motion_min_pixels: 8
  small_motion_max_ratio: 0.05
  motion_crop_jitter: 0.2
  augment_profile: legacy
  source_options:
    vimeo:
      framesteps: [1]
      augment_profile: vimeo
    xtrain:
      framesteps: [1]
      resize_hw: [256, 256]
      augment_profile: vimeo
    teacher:
      framesteps: [1]
      augment_profile: legacy
  val_lists:
    all: val.txt
    easy: easy_val.txt
    normal: normal_val.txt
    hard: hard_val.txt
    vimeo: vimeo_val.txt
    xtrain: xtrain_val.txt
    teacher: teacher_val.txt

phases:
  - name: all_teacher_fixed
    epochs: 240
    steps_per_epoch: 1604
    grad_accum_steps: 2
    lr_schedule: phase
    trainable: all
    local: false
    crop_sizes:
      - [256, 256, 20]
    # micro batch20: 10 Vimeo + 2 X-TRAIN + 2×3常规 + 2 teacher。
    ratios: {vimeo: 0.5, xtrain: 0.1, easy: 0.1, normal: 0.1, hard: 0.1, teacher: 0.1}
    batch_counts: {vimeo: 10, xtrain: 2, easy: 2, normal: 2, hard: 2, teacher: 2}
    curriculum:
      source: xtrain
      every_epochs: 40
      max_stage: 5
      framestep_start: 1
      framestep_multiplier: 2
      resize_start: 256
      resize_multiplier: 1.1

  - name: teacher_ifblock_fixed
    epochs: 80
    steps_per_epoch: 1604
    grad_accum_steps: 2
    lr_schedule: phase
    trainable: local_ifblock
    local: true
    crop_sizes:
      - [256, 256, 20]
    # local阶段仍保留10% teacher，避免再次被flow loss主导。
    ratios: {vimeo: 0.9, teacher: 0.1, xtrain: 0.0, easy: 0.0, normal: 0.0, hard: 0.0}
    batch_counts: {vimeo: 18, teacher: 2}

monitor:
  eval_every_epochs: 20
  save_every_epochs: 10
  log_every_steps: 100
  print_every_steps: 10
  spike_ratio: 3.0
  spike_dir: spike_samples_s2v3_all_teacher_flow_fixed
  flow_loss_dump_threshold: 40
  dump_dir: anomaly_dumps_s2v3_all_teacher_flow_fixed
  dump_max: 20
  best_metric: teacher/moving_flow_epe
  best_mode: min
