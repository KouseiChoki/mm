# Friday-to-Tuesday long run: inject the separately pretrained FlyingThings
# correspondence pyramid into the first two 0729 flow heads.  The encoder is
# frozen; only the cost-volume adapters and the original VFI model train.
#
# Start from 0729 (do not use --resume):
#   python train.py \
#     --config train_config_0821_lc_pretrained_corr_weekend.yaml \
#     --restore_ckpt ckpt/0729_lc_v3s2/0729_lc_v3s2_800.pkl

exp_name: 0821_0729_lc_pretrained_corr_tuesday
seed: 1234

model:
  F: 32
  depth: [2, 2, 2, 3, 3]
  version: 3
  refine_attn_dim: 512
  refine_attn_heads: 8
  refine_kv_pool: 4
  refine_res_scale: 0.25
  ssm_version: 2
  ssd_dstate: 64
  ssd_headdim: 64
  ssd_chunk: 256

  blend_mode: soft
  pervfi_mask_loss_weight: 0.0
  loss_type: lc
  lc_charbonnier_eps: 1.0e-3
  lc_census_weight: 1.0
  lc_lap_weight: 1.0
  lc_warp_weight: 0.5
  merge_loss_gamma: 0.5
  normalize_pixel_loss: true
  residual_loss_weight: 0.01

  edge_loss_weight: 0.15
  edge_warp_loss_weight: 0.10
  edge_motion_gain: 2.0
  edge_motion_scale: 0.10
  edge_weight_cap: 3.0
  edge_charbonnier_eps: 1.0e-3

  # Only FlyingThings samples have MV. This weak weight provides a motion
  # anchor without repeating the failed teacher-repair dominance.
  flow_loss_weight: 0.0005
  flow_loss_warmup_steps: 2000
  flow_stage_gamma: 0.2
  flow_motion_threshold: 1.0
  flow_motion_balance: 0.5
  flow_motion_gain: 0.5
  flow_motion_scale: 10.0
  flow_motion_weight_cap: 3.0
  flow_charbonnier_eps: 1.0e-3

  flow_num_stages: 3
  compact_quarter_head: false
  zero_init_residual_heads: true
  local_zero_init: true
  content_aware_upsampling: false
  sparse_matching: false
  multi_hypothesis: false
  pyramid_correlation: false

  # 1/16 -> learned coarse head, 1/8 -> learned middle head. The original
  # 1/4 head and both local IFBlocks remain unchanged.
  pretrained_correspondence: true
  pretrained_correspondence_path: ckpt/0821_flyingthings_correspondence_pretrain/best.pkl
  pretrained_correspondence_required: true
  pretrained_correspondence_frozen: true
  pretrained_correspondence_stages: [0, 1]
  pretrained_correspondence_transformer_layers: 6
  pretrained_correspondence_max_feature_tokens: 2880
  pretrained_correspondence_radii: [6, 4]
  pretrained_correspondence_temperature: 0.07
  pretrained_correspondence_init_scale: 0.01

optim:
  lr_max: 1.0e-5
  lr_min: 2.0e-6
  warmup_steps: 500
  finetune: true
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  backbone_lr_scale: 0.25
  flow_lr_scale: 1.0
  refine_lr_scale: 0.25

data:
  root: /home/zhenying/qhong/data/ssd/vfi_database
  lists_dir: /home/zhenying/qhong/data/ssd/vfi_database/lists
  tiers: [hard, vimeo, xtrain, teacher_flyingthings]
  batch_size: 4
  num_workers: 12
  prefetch_factor: 4
  in_order: false
  val_num_workers: 4
  val_samples_per_scene: 1
  crop_sizes: [[384, 704, 4]]
  framesteps: [1]
  t_half_prob: 1.0
  mv_prob: 1.0
  mv_sign: [1, 1]
  mv_symmetry_confidence: false
  occ_alpha: 0.05
  occ_beta: 1.0

  mv_cache_dirname: mv_cache_f16
  mv_cache_required: true
  mv_cache_preview_stride: 4
  mv_cycle_confidence: hard
  mv_cycle_cache_required: true
  val_mv_cycle_confidence: hard
  val_mv_cycle_cache_required: false
  mv_cycle_on_the_fly: false
  val_mv_cycle_on_the_fly: false
  motion_aware_crop_prob: 0.7
  interpolation_aware_crop_prob: 0.6
  interpolation_residual_threshold: 0.04
  motion_crop_threshold: 1.0
  small_motion_min_pixels: 8
  small_motion_max_ratio: 0.05
  motion_crop_jitter: 0.2
  augment_profile: legacy
  source_options:
    hard:
      framesteps: [1, 2]
      augment_profile: legacy
    vimeo:
      framesteps: [1]
      augment_profile: legacy
    xtrain:
      framesteps: [4, 8, 16, 32]
      augment_profile: legacy
    teacher_flyingthings:
      framesteps: [1]
      augment_profile: legacy
  val_lists:
    hard: hard_val.txt
    vimeo: vimeo_val.txt
    xtrain: xtrain_val.txt
    teacher_flyingthings: teacher_flyingthings_val.txt

phases:
  # Let the new adapters learn to consume the reliable descriptors while a
  # small amount of hard-cycle GT motion is still visible.
  - name: corr_teacher_adapt
    # About 10 hours. Keep synthetic GT motion short relative to the target
    # phases so it anchors the adapters without dominating reconstruction.
    epochs: 120
    steps_per_epoch: 401
    grad_accum_steps: 3
    lr_schedule: phase
    trainable: all
    local: true
    crop_sizes: [[384, 704, 4]]
    ratios: {hard: 0.225, vimeo: 0.225, xtrain: 0.45, teacher_flyingthings: 0.10}

  # Main reconstruction phase: remove synthetic MV supervision and optimize
  # the actual target domains for most of the weekend.
  - name: corr_target_reconstruction
    # Main ~52-hour phase. This is where the pretrained matching prior must
    # prove useful on real target-domain reconstruction rather than MV EPE.
    epochs: 630
    steps_per_epoch: 401
    grad_accum_steps: 3
    lr_schedule: phase
    trainable: all
    local: true
    optim:
      lr_max: 1.0e-5
      lr_min: 2.0e-6
      warmup_steps: 500
    crop_sizes: [[384, 704, 4]]
    ratios: {hard: 0.25, vimeo: 0.25, xtrain: 0.50, teacher_flyingthings: 0.0}

  # Low-LR hard-scene consolidation for small objects and repeated texture.
  - name: corr_hard_consolidation
    # Final ~25-hour low-LR consolidation ends near Tuesday morning when a
    # Friday 16:00 launch runs at the measured ~0.745 s/step.
    epochs: 300
    steps_per_epoch: 401
    grad_accum_steps: 3
    lr_schedule: phase
    trainable: all
    local: true
    optim:
      lr_max: 4.0e-6
      lr_min: 1.0e-6
      warmup_steps: 200
    crop_sizes: [[384, 704, 4]]
    ratios: {hard: 0.50, vimeo: 0.20, xtrain: 0.30, teacher_flyingthings: 0.0}

monitor:
  record_root: record
  eval_every_epochs: 10
  save_every_epochs: 20
  log_every_steps: 20
  print_every_steps: 10
  spike_ratio: 3.0
  spike_dir: spike_samples
  flow_loss_dump_threshold: 40
  dump_dir: anomaly_dumps
  dump_max: 20
  mv_compare_every_epochs: 20
  mv_compare_max_samples: 2
  mv_compare_dir: mv_comparisons
  best_metric: xtrain/psnr
  best_mode: max
